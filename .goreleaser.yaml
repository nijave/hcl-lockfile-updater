# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: hcl-lockfile-updater

builds:
  - id: hcl-lockfile-updater
    main: .
    binary: hcl-lockfile-updater
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore\(deps\)'
